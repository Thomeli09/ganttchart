[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "ganttchart"
version = "0.0.1"
description = "Tools for generating Gantt charts"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"

authors = [
    { name = "Eliott Thommes" }
]

dependencies = [
    "numpy>=2.5.4",
    "matplotlib",
    "shapely",
]

keywords = [
    "rockfall",
    "geotechnical engineering",
    "rock mechanics",
    "simulation",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
]


[project.urls]
Homepage = "https://github.com/Thomeli09/ganttchart"
Repository = "https://github.com/Thomeli09/ganttchart"
Issues = "https://github.com/Thomeli09/ganttchart/issues"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]